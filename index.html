<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #cccccc;
      color: black;
    }

    #no.escape {
      position: absolute;
      transition: top 0.2s ease, left 0.2s ease;
    }

    /* Fullscreen overlay для YES */
    #overlay {
      display: none; /* СКРЫТ по умолчанию */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 230, 230, 0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #overlay h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff4d6d;
      text-align: center;
    }

    #overlay img {
      max-width: 80%;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine, Kotik? ❤️</h1>

  <div class="buttons">
    <button id="yes">YES</button>
    <button id="no">no</button>
  </div>

  <!-- overlay для YES -->
  <div id="overlay">
    <h2>I knew it! 💘</h2>
    <img src="https://media.giphy.com/media/NddKDRg7KfFHkHdJ19/giphy.gif" alt="Valentine GIF">
  </div>

  <script>
    const noButton = document.getElementById('no');
    const buttonsContainer = document.querySelector('.buttons');
    const yesButton = document.getElementById('yes');
    const overlay = document.getElementById('overlay');

    const texts = [
      'no',
      'are you sure?',
      'really?',
      'think again 😏'
    ];

    let clickCount = 0;
    let escaped = false;

    function moveButton() {
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const maxX = window.innerWidth - buttonWidth;
      const maxY = window.innerHeight - buttonHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noButton.style.left = randomX + 'px';
      noButton.style.top = randomY + 'px';
    }

    noButton.addEventListener('click', () => {
      clickCount++;
      noButton.textContent = texts[clickCount % texts.length];

      if (!escaped) {
        escaped = true;
        noButton.classList.add('escape');
        document.body.appendChild(noButton);
      }

      moveButton();
    });

    yesButton.addEventListener('click', () => {
      overlay.style.display = 'flex';       // показываем overlay
      buttonsContainer.style.display = 'none'; // скрываем кнопки
    });
  </script>

</body>
</html>
