<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 20px;
      z-index: 1;
      position: relative;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #cccccc;
      color: black;
    }

    #no.escape {
      position: absolute;
      transition: top 0.2s ease, left 0.2s ease;
    }

    /* дрожащая анимация */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }

    /* overlay для YES */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 230, 230, 0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #overlay.show {
      display: flex;
      opacity: 1;
    }

    #overlay h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff4d6d;
      text-align: center;
    }

    #overlay img {
      max-width: 80%;
      height: auto;
      border-radius: 12px;
    }

    /* сердечки */
    .heart {
      position: absolute;
      font-size: 24px;
      color: #ff4d6d;
      pointer-events: none;
      animation: floatUp 1.5s ease forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine, Kotik? ❤️</h1>

  <div class="buttons">
    <button id="yes">YES</button>
    <button id="no">no</button>
  </div>

  <!-- overlay для YES -->
  <div id="overlay">
    <h2>I knew it! 💘</h2>
    <img id="overlay-img" src="" alt="Valentine GIF">
  </div>

  <script>
    const noButton = document.getElementById('no');
    const buttonsContainer = document.querySelector('.buttons');
    const yesButton = document.getElementById('yes');
    const overlay = document.getElementById('overlay');
    const overlayImg = document.getElementById('overlay-img');

    const texts = [
      'no',
      'are you sure?',
      'really?',
      'think again 😏'
    ];

    let clickCount = 0;
    let escaped = false;

    function moveButton() {
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;
      const maxX = window.innerWidth - buttonWidth;
      const maxY = window.innerHeight - buttonHeight;
      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;
      noButton.style.left = randomX + 'px';
      noButton.style.top = randomY + 'px';
    }

    noButton.addEventListener('click', () => {
      clickCount++;
      noButton.textContent = texts[clickCount % texts.length];

      if (!escaped) {
        escaped = true;
        noButton.classList.add('escape');
        document.body.appendChild(noButton);
      }

      // дрожание перед прыжком
      noButton.style.animation = 'shake 0.2s';
      setTimeout(() => {
        noButton.style.animation = '';
        moveButton();
      }, 200);
    });

    yesButton.addEventListener('click', (e) => {
      overlayImg.src = "https://media.giphy.com/media/NddKDRg7KfFHkHdJ19/giphy.gif";
      overlay.classList.add('show');
      buttonsContainer.style.display = 'none';

      // создаем сердечки
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.textContent = '❤️';
        heart.style.left = (e.clientX + Math.random() * 100 - 50) + 'px';
        heart.style.top = (e.clientY + Math.random() * 50 - 25) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }
    });
  </script>

</body>
</html>
