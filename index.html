<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 30px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #cccccc;
      color: black;
    }

    /* активируется ТОЛЬКО после первого клика */
    #no.escape {
      position: absolute;
      transition: top 0.2s ease, left 0.2s ease;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="yes" onclick="alert('Yay! ❤️')">YES</button>
    <button id="no">no</button>
  </div>

  <script>
    const noButton = document.getElementById('no');
    const buttonsContainer = document.querySelector('.buttons');

    const texts = [
      'no',
      'are you sure?',
      'really?',
      'think again 😏'
    ];

    let clickCount = 0;
    let escaped = false;

    function moveButton() {
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const maxX = window.innerWidth - buttonWidth;
      const maxY = window.innerHeight - buttonHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noButton.style.left = randomX + 'px';
      noButton.style.top = randomY + 'px';
    }

    noButton.addEventListener('click', () => {
      clickCount++;
      noButton.textContent = texts[clickCount % texts.length];

      if (!escaped) {
        // первый клик: вырываем кнопку из контейнера
        escaped = true;
        noButton.classList.add('escape');
        document.body.appendChild(noButton);
      }

      moveButton();
    });
  </script>

</body>
</html>
